name: codigo_de_barras
description: "Podras escanear un codigo de barras con tu camara"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  barcode_widget: ^2.0.4
  esc_pos_utils_plus: ^2.0.4
  excel: ^4.0.6
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.1.0
  mobile_scanner: ^7.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/product.json
    - assets/img/

flutter_icons:
  image_path: "assets/img/Barcode.jpeg"
  android: true
  ios: true
